# Installed ON VOSTRO as
#   /etc/systemd/system/nas-offsite-tunnel.service.d/10-pick-address.conf
# Replaces the base unit's autossh with a fixed VPS address: autossh restarts
# ssh with the same arguments, so a blocked address is retried forever. The
# wrapper picks a reachable address on every start; systemd does the restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the unit.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/nas-offsite-tunnel.sh
Restart=always
RestartSec=30
