# Immich-only compose for step-by-step deployment.
# On Jetson Nano 4GB, disable ML until load tests are complete.
name: homecloud-immich
services:
  immich-db:
    image: tensorchord/pgvecto-rs:pg16-v0.3.0@sha256:b89f8ddbb28400d428d3c5e3e860f578cde85ad8e78544a8b687b97937cfc50b
    container_name: homecloud_immich_db
    restart: always
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homecloud_internal

  immich-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: homecloud_immich_redis
    restart: always
    mem_limit: 64m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homecloud_internal

  immich-server:
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    container_name: homecloud_immich_server
    restart: always
    mem_limit: 768m    # API only since the worker split (b85a1aa)
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    ports:
      - "2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IMMICH_DISABLE_MACHINE_LEARNING: ${IMMICH_DISABLE_MACHINE_LEARNING:-true}
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_MACHINE_LEARNING_URL:-}
      TZ: ${TZ}
      # Immich 2.x starts BOTH workers in every container unless told otherwise (`start.sh microservices` is
      # ignored): each job queue then runs twice, and "concurrency 1" meant two parallel library crawls of the
      # ntfs-3g archive -> mount hang 2026-10-13 19:02 UTC, Nextcloud down 10 h. API only here, jobs only below.
      IMMICH_WORKERS_INCLUDE: api
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/usr/src/app/upload
      # FAM-4 photobank (owner 2026-10-13): the whole 2 TB archive, read-only, at the same path as on the host,
      # so that external-library import paths are real host paths and adding a folder is an API call, not a
      # recreate. Pitfalls: (1) if the HDD is not mounted when the container starts, Docker binds the empty
      # mount point and the library goes offline until a rescan; (2) Immich now holds the ntfs-3g mount — after
      # a ntfs-3g restart recreate these containers too (CLAUDE.md, ntfs-3g pitfalls).
      - /mnt/hdd2tb:/mnt/hdd2tb:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homecloud_internal

  immich-microservices:
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    container_name: homecloud_immich_microservices
    command: ['start.sh', 'microservices']
    restart: always
    mem_limit: 1024m   # all jobs run here now; 512m OOM-killed on the first library scan (2026-10-14)
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IMMICH_DISABLE_MACHINE_LEARNING: ${IMMICH_DISABLE_MACHINE_LEARNING:-true}
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_MACHINE_LEARNING_URL:-}
      TZ: ${TZ}
      IMMICH_WORKERS_INCLUDE: microservices
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/usr/src/app/upload
      - /mnt/hdd2tb:/mnt/hdd2tb:ro
    healthcheck:
      # The v2.7.5 image has no pgrep (procps): the old check could never pass, and the
      # container watchdog (OPS-1) restarted the container every few minutes once it was
      # recreated (2026-10-13). Immich sets its process title to "immich"/"immich-api".
      test: ["CMD-SHELL", "grep -qa '^immich' /proc/[0-9]*/cmdline || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homecloud_internal

networks:
  homecloud_internal:
    driver: bridge
