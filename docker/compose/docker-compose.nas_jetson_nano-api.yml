name: homecloud-nasa-api
services:
  nas_jetson_nano-api:
    build:
      context: ../../services/nas_jetson_nano-api
    # Контейнер намеренно НЕ переименован в homecloud_nas_jetson_nano_api: на устройстве
    # уже работает homecloud_nasa_api на порту 8099, и наивный деплой под новым именем
    # создал бы второй, конкурирующий контейнер вместо пересоздания старого.
    container_name: homecloud_nasa_api
    restart: always
    mem_limit: 128m
    ports:
      - "8099:8099"
    volumes:
      # Shared log directory — persists JSON logs on host
      # Пути хоста — из раскладки (docs/35_HOST_LAYOUT.md); на устройстве заданы в config/.env
      - ${NAS_LOG_DIR:-/var/log/nas_jetson_nano-monitor}:/var/log/nas_jetson_nano-monitor
      # Docker socket — for `docker ps` inside container
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Report script — for POST /v1/report/now
      - ${NAS_SBIN_PREFIX:-/usr/local/sbin/nas_jetson_nano}-send-report-telegram.sh:/usr/local/sbin/nas_jetson_nano-send-report-telegram.sh:ro
      - ${NAS_CONF_DIR:-/etc/nas_jetson_nano-monitor}:/etc/nas_jetson_nano-monitor:ro
      # E3: снимок активных алертов Phase E (talk-alert) — для «бобик, что сломалось»
      - ${NAS_STATE_DIR:-/var/lib/nas_jetson_nano-monitor}:/var/lib/nas_jetson_nano-monitor:ro
      # Качалка: только для statvfs (свободное место), на запись боту не нужно
      - /mnt/storage/downloads:/dl/ssd:ro
      - /mnt/hdd2tb/Downloads:/dl/hdd:ro
    environment:
      API_LOG_LEVEL: ${NAS_JETSON_NANO_API_LOG_LEVEL:-INFO}
      JWT_SECRET: ${NAS_JETSON_NANO_API_JWT_SECRET}
      JWT_TTL_HOURS: ${NAS_JETSON_NANO_API_JWT_TTL_HOURS:-24}
      NEXTCLOUD_INTERNAL_URL: ${NEXTCLOUD_INTERNAL_URL:-http://host.docker.internal:8080}
      EXPECTED_CONTAINERS: >-
        homecloud_nextcloud
        homecloud_nextcloud_db
        homecloud_nextcloud_redis
        homecloud_immich_server
        homecloud_immich_microservices
        homecloud_immich_db
        homecloud_immich_redis
        homecloud_llm_gateway
        homecloud_nasa_api
        homecloud_samba
        homecloud_netdata
        homecloud_uptime_kuma
        homecloud_portainer
        homecloud_downloads
      LOCAL_SERVICES: >-
        Nextcloud=http://192.168.0.50:8080/
        Immich=http://192.168.0.50:2283/
        LLM-Gateway=http://192.168.0.50:8090/health
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      # C2: владельцы (логины Nextcloud); администратор Nextcloud — владелец всегда
      API_OWNERS: ${API_OWNERS:-}
      # C1: пусто — CORS выключен (был `*`)
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # C6: предел вложения для @бобик, байт
      TALK_BOT_MAX_ATTACHMENT_BYTES: ${TALK_BOT_MAX_ATTACHMENT_BYTES:-10485760}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      TALK_FAMILY_ROOM: ${TALK_FAMILY_ROOM:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      # Talk AI bot (Phase A). Disabled by default; set TALK_BOT_ENABLED=true in .env to activate.
      TALK_BOT_ENABLED: ${TALK_BOT_ENABLED:-false}
      TALK_BOT_ROOM: ${TALK_BOT_ROOM:-}
      TALK_BOT_TRIGGER: ${TALK_BOT_TRIGGER:-}
      TALK_BOT_DISPLAY_NAME: ${TALK_BOT_DISPLAY_NAME:-NAS Bot}
      TALK_BOT_POLL_TIMEOUT: ${TALK_BOT_POLL_TIMEOUT:-30}
      # Talk AI bot (Phase C) — free-form questions to the provider.
      # Empty callsign = off; the bot stays local-only.
      TALK_BOT_ROOMS: ${TALK_BOT_ROOMS:-}
      TALK_BOT_LLM_TRIGGER: ${TALK_BOT_LLM_TRIGGER:-}
      TALK_BOT_LLM_DISPLAY_NAME: ${TALK_BOT_LLM_DISPLAY_NAME:-Бобик}
      TALK_BOT_LLM_URL: ${TALK_BOT_LLM_URL:-http://host.docker.internal:8090/v1/chat}
      TALK_BOT_LLM_PROVIDER: ${TALK_BOT_LLM_PROVIDER:-gigachat}
      # A3: тот же токен, что у шлюза; пусто — заголовок не шлётся
      LLM_GATEWAY_SERVICE_TOKEN: ${LLM_GATEWAY_SERVICE_TOKEN:-}
      TALK_BOT_LLM_TIMEOUT: ${TALK_BOT_LLM_TIMEOUT:-150}
      TALK_BOT_LLM_MAX_CHARS: ${TALK_BOT_LLM_MAX_CHARS:-1000}
      TALK_BOT_LLM_DAILY_REPLIES: ${TALK_BOT_LLM_DAILY_REPLIES:-50}
      # Telegram-бот, первый срез (качалка + вопросы @бобик)
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USERS: ${TELEGRAM_USERS:-}
      TELEGRAM_FAMILY_CHAT_ID: ${TELEGRAM_FAMILY_CHAT_ID:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-socks5://172.17.0.1:1080}
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:-}
      DL_SSD_MIN_FREE_GB: ${DL_SSD_MIN_FREE_GB:-40}
      DL_HDD_MIN_FREE_GB: ${DL_HDD_MIN_FREE_GB:-50}
      DL_SSD_MAX_GB: ${DL_SSD_MAX_GB:-20}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/healthcheck', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homecloud_internal

networks:
  homecloud_internal:
    external: true
