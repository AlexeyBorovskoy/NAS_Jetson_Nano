name: Quality Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # ShellCheck + bash syntax check
  # ---------------------------------------------------------------------------
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Bash syntax check (bash -n)
        run: |
          echo "=== Bash syntax check ==="
          ERRORS=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; ERRORS=$((ERRORS+1)); }
          done < <(find scripts/ services/ tests/ -name "*.sh" -type f | sort)
          echo "Syntax check complete: errors=$ERRORS"
          exit "$ERRORS"

      - name: ShellCheck (warning level)
        run: |
          echo "=== ShellCheck warnings ==="
          find scripts/ services/ tests/ -name "*.sh" -type f | sort | while read -r f; do
            echo "--- $f ---"
            shellcheck --severity=warning --shell=bash "$f" || true
          done

      - name: ShellCheck (error level, enforced)
        run: |
          echo "=== ShellCheck errors (enforced) ==="
          find scripts/ services/ tests/ -name "*.sh" -type f -print0 | \
            xargs -0 shellcheck --severity=error --shell=bash --format=gcc

  # ---------------------------------------------------------------------------
  # Docker Compose validation
  # ---------------------------------------------------------------------------
  compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose version
        run: docker compose version

      - name: Prepare stub .env for CI
        run: cp config/.env.example config/.env

      - name: Validate stage1
        run: docker compose -f docker/compose/docker-compose.stage1.yml --env-file config/.env config --quiet

      - name: Validate nextcloud
        run: docker compose -f docker/compose/docker-compose.nextcloud.yml --env-file config/.env config --quiet

      - name: Validate immich
        run: docker compose -f docker/compose/docker-compose.immich.yml --env-file config/.env config --quiet

      - name: Validate llm-gateway
        run: docker compose -f docker/compose/docker-compose.llm-gateway.yml --env-file config/.env config --quiet

      - name: Validate samba
        run: docker compose -f docker/compose/docker-compose.samba.yml --env-file config/.env config --quiet

      - name: Validate monitoring
        run: docker compose -f docker/compose/docker-compose.monitoring.yml --env-file config/.env config --quiet

      # Blocking since 2026-10-02 (CQ-11): the step passed with `|| true`, so a
      # broken NAS API compose file would have gone green. Run 36829956028
      # showed it validates cleanly (only an IMMICH_API_KEY blank warning).
      - name: Validate nas_jetson_nano-api
        run: docker compose -f docker/compose/docker-compose.nas_jetson_nano-api.yml --env-file config/.env config --quiet

      - name: Validate VPS compose
        run: docker compose -f docker/vps/docker-compose.yml --env-file config/.env config --quiet

  # ---------------------------------------------------------------------------
  # Security: secrets scan + Trivy
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for gitleaks full history scan

      - name: Local secrets check
        run: bash scripts/security/check_no_secrets.sh

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin/ gitleaks
          gitleaks version

      - name: Gitleaks secrets scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

      - name: Verify Gitleaks scans deleted history
        run: |
          probe_repo="$(mktemp -d)"
          trap 'rm -rf "$probe_repo"' EXIT
          git -C "$probe_repo" init --quiet
          git -C "$probe_repo" config user.name "CI security probe"
          git -C "$probe_repo" config user.email "ci-probe@example.invalid"
          printf 'GITHUB_TOKEN=%s%s\n' 'ghp_' '0123456789abcdefghijklmnopqrstuvwxyz' \
            > "$probe_repo/leaked.env"
          git -C "$probe_repo" add leaked.env
          git -C "$probe_repo" commit --quiet -m "temporary leak"
          git -C "$probe_repo" rm --quiet leaked.env
          git -C "$probe_repo" commit --quiet -m "remove leak from worktree"
          set +e
          gitleaks detect --source "$probe_repo" --redact --no-banner --exit-code 1
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 1 ]; then
            echo "gitleaks did not detect the deleted secret in Git history (rc=$probe_rc)" >&2
            exit 1
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: secret,misconfig
          exit-code: 0
          format: table
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Service tests: LLM Gateway + NAS API (pytest).
  # History: 2026-09-19 commit d52c11b broke every GigaChat chat (HTTP 500) while
  # CI had no Python test job at all (audit NAS-REG-001 / NAS-QA-001).
  # Each directory runs separately: both services name their package `app`.
  # ---------------------------------------------------------------------------
  service-tests:
    name: Service tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          # restic — для полного круга backup → restore drill (tests/unit/test_config_backup.py)
          sudo apt-get install -y restic

      - name: Unit tests (tests/unit)
        run: |
          for t in tests/unit/test_*.py; do python "$t"; done

      # Stage 8 (code audit 2026-10-02, docs/audit/2026-10-02_code_audit/PLAN.ru.md
      # "Храповик"): a structural refactor fixed by a PR is free to drift back the
      # moment nobody is watching — this is the standing gate, not a one-off report.
      # actions/checkout@v4 above is a shallow clone (depth=1): commits/churn/
      # hotspot are never compared by --check, and code_metrics.py's churn()
      # tolerates a `git log` failure, so the shallow history cannot fail this step.
      - name: Code metrics ratchet
        run: |
          python scripts/quality/code_metrics.py \
            --check docs/audit/2026-10-02_code_audit/baseline.json

      - name: LLM Gateway tests
        run: python -m pytest -q tests/llm_gateway
        env:
          IMAGE_OUTPUT_ROOT: ${{ runner.temp }}/images
          LLM_USAGE_FILE: ${{ runner.temp }}/usage.json

      - name: NAS API tests
        run: python -m pytest -q tests/nas_api

      - name: Watchdog tests (D3)
        run: python -m pytest -q tests/watchdog

      # BK-1 (аудит 2026-09-26): отдельным процессом — у сервисов одинаковое имя пакета app (QA-2).
      - name: Backup API tests
        run: |
          python -m pytest -q tests/backup_api

      # E10: сервис распознавания речи (vosk подменяется в тестах — ставить не нужно).
      - name: STT tests
        run: python -m pytest -q tests/stt

      # Учёт VPN и нагрузки VPS (спецификация 2026-10-04): только стандартная библиотека.
      - name: VPN monitor tests
        run: python -m pytest -q tests/vpn_monitor

  # ---------------------------------------------------------------------------
  # actionlint: validate GitHub Actions workflow files
  # ---------------------------------------------------------------------------
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: |
          echo "=== actionlint: validating GitHub Actions workflows ==="
          actionlint .github/workflows/*.yml
