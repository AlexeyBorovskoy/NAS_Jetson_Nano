name: homecloud-llm-gateway
services:
  llm-gateway:
    build:
      context: ../../services/llm-gateway
    container_name: homecloud_llm_gateway
    restart: always
    mem_limit: 256m
    ports:
      - "8090:8090"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_REASONER_MODEL: ${DEEPSEEK_REASONER_MODEL}
      # GigaChat / Sber — второй провайдер за тем же редактированием и бюджетом.
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-/certs/russian_trusted_bundle.pem}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-10}
      LLM_PRICE_USD_PER_MTOKEN: ${LLM_PRICE_USD_PER_MTOKEN:-0.5}
      LLM_USAGE_FILE: ${LLM_USAGE_FILE:-/data/llm_usage.json}
      LLM_REDACT_PERSONAL_DATA: ${LLM_REDACT_PERSONAL_DATA}
      LLM_REDACT_NAMES: ${LLM_REDACT_NAMES:-}
      LLM_LOG_PROMPTS: ${LLM_LOG_PROMPTS}
      LLM_LOG_RESPONSES: ${LLM_LOG_RESPONSES}
    volumes:
      # Persist budget counters so a restart does not reset the day's spend.
      - llm_usage:/data
      # Russian Trusted CA bundle — required for GigaChat TLS verification.
      # Public root certificates, not secrets; read-only.
      - ../../config/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - homecloud_internal

volumes:
  llm_usage:

networks:
  homecloud_internal:
    driver: bridge
